name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install-ci-test

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Install Hurl
        run: choco install hurl -y --version=6.1.1

      - name: Verify Hurl installation
        run: hurl --version

      - name: Start Docker services
        run: docker compose up -d --wait

      - name: Setup test environment
        run: ./scripts/local-aws-setup.sh

      - name: Wait for API readiness
        run: |
          $retryCount = 0
          $maxRetries = 10
          do {
              $response = Invoke-WebRequest -Uri "http://localhost:8080/health" -ErrorAction SilentlyContinue
              if ($response.Content -match "ok") {
                  Write-Host "Service ready"
                  exit 0
              }
              Write-Host "Waiting for service..."
              Start-Sleep -Seconds 5
              $retryCount++
          } while ($retryCount -lt $maxRetries)
          Write-Host "Service not ready"
          exit 1

      - name: Run integration tests
        run: npm run test:integration

  deploy:
    name: Deploy to Docker Hub
    needs: [lint, dockerfile-lint, unit-tests, integration-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_REPO }}:latest