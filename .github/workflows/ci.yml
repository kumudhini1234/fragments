name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install-ci-test

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Install Chocolatey
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          refreshenv

      - name: Install Hurl
        shell: pwsh
        run: |
          choco install hurl -y --version=6.1.1
          hurl --version

      - name: Start Docker services
        run: docker compose up -d --wait

      - name: Setup test environment
        run: ./scripts/local-aws-setup.sh

      - name: Wait for API readiness
        shell: pwsh
        run: |
          $retries = 10
          $delay = 5
          $url = "http://localhost:8080/health"
          
          for ($i = 0; $i -lt $retries; $i++) {
              try {
                  $response = Invoke-WebRequest -Uri $url -ErrorAction Stop
                  if ($response.Content -match "ok") {
                      Write-Host "Service ready"
                      exit 0
                  }
              } catch {
                  if ($i -eq ($retries - 1)) { exit 1 }
                  Write-Host "Waiting for service..."
                  Start-Sleep -Seconds $delay
              }
          }

      - name: Run integration tests
        run: npm run test:integration

  deploy:
    name: Deploy to Docker Hub
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_REPO }}:latest