name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm install-ci-test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm install

      - name: Install Hurl (Guaranteed Method)
        run: |
          echo "Installing Hurl..."
          # Try multiple reliable sources
          if ! wget https://github.com/Orange-OpenSource/hurl/releases/download/6.1.1/hurl-6.1.1-x86_64-linux.tar.gz -O hurl.tar.gz || ! tar -tzf hurl.tar.gz >/dev/null; then
            echo "Trying alternative download..."
            if ! wget https://github.com/Orange-OpenSource/hurl/releases/download/6.1.1/hurl-linux-x86_64 -O /usr/local/bin/hurl; then
              echo "Using Ubuntu package as final fallback..."
              sudo apt-get update && sudo apt-get install -y hurl
            else
              chmod +x /usr/local/bin/hurl
            fi
          else
            tar -xzf hurl.tar.gz -C /usr/local/bin/ --strip-components=1 hurl-6.1.1/hurl
            rm hurl.tar.gz
          fi
          hurl --version

      - name: Build Containers
        run: docker compose up -d

      - name: Setup Local AWS Resources
        run: ./scripts/local-aws-setup.sh

      - name: Wait for API readiness
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8080/health | grep -q "ok"; then
              echo "Service ready"
              exit 0
            fi
            echo "Waiting for service..."
            sleep 5
          done
          echo "Service did not become ready"
          exit 1

      - name: Run Hurl Tests
        run: npm run test:integration

  docker-hub:
    name: Build and Push to Docker Hub
    needs: [lint, dockerfile-lint, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ env.SHA_TAG }}, ${{ env.DOCKERHUB_REPO }}:main, ${{ env.DOCKERHUB_REPO }}:latest